<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Una pregunta ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffe6ef, #fff5f8);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            width: 90%;
        }

        h1 {
            font-size: clamp(28px, 7vw, 44px);
            margin-bottom: 50px;
            color: #333;
        }

        /*
         * Los dos botones empiezan juntos
         */
        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        button {
            border: none;
            padding: 15px 30px;
            min-width: 110px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        #yes {
            background: #4CAF50;
            color: white;
            position: relative;
            z-index: 10;

            transition:
                left 0.3s ease,
                top 0.3s ease,
                transform 0.2s ease;
        }

        #no {
            background: #f44336;
            color: white;

            position: relative;
            z-index: 10;

            transition:
                left 0.25s ease,
                top 0.25s ease,
                transform 0.15s ease;
        }

        /*
         * Animación cuando un botón escapa
         */
        .shake {
            animation: shake 0.3s;
        }

        @keyframes shake {
            0%   { transform: translateX(0); }
            25%  { transform: translateX(-8px) rotate(-3deg); }
            50%  { transform: translateX(8px) rotate(3deg); }
            75%  { transform: translateX(-8px) rotate(-3deg); }
            100% { transform: translateX(0); }
        }


        /*
         * MODAL
         */
        .modal {
            display: none;

            position: fixed;
            z-index: 100;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.45);

            justify-content: center;
            align-items: center;

            padding: 25px;
        }

        .modal-content {
            background: white;

            width: 100%;
            max-width: 380px;

            padding: 35px 25px;

            border-radius: 20px;

            text-align: center;

            box-shadow: 0 10px 40px rgba(0,0,0,0.2);

            animation: modalAppear 0.3s ease;
        }

        .modal-content h2 {
            margin: 0 0 25px 0;

            font-size: 28px;

            color: #333;
        }

        .modal-content button {
            background: #333;
            color: white;

            min-width: 120px;
        }

        @keyframes modalAppear {

            from {
                opacity: 0;
                transform: scale(0.7);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }


        /*
         * Pantalla final
         */
        .success {
            animation: modalAppear 0.5s ease;
        }

        .hearts {
            font-size: 50px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>


    <div class="container" id="content">

        <h1>
            Clica la opciò correcte
        </h1>

        <h2>
            Anem al teatre? 🎭
        </h2>

        <div class="buttons">

            <button id="yes">
                Sí 😍
            </button>

            <button id="no">
                No 😢
            </button>

        </div>

    </div>


    <!-- MODAL -->

    <div class="modal" id="modal">

        <div class="modal-content">

            <h2 id="modalMessage">
                No sóc tan fàcil 😏
            </h2>

            <button id="closeModal">
                Continuar
            </button>

        </div>

    </div>


    <script>

        var yesButton = document.getElementById("yes");
        var noButton = document.getElementById("no");

        var modal = document.getElementById("modal");
        var modalMessage = document.getElementById("modalMessage");
        var closeModal = document.getElementById("closeModal");

        /*
         * Contador de intentos
         */
        var yesAttempts = 0;


        /*
         * Mueve un botón a una posición aleatoria
         * dentro de la pantalla.
         */
        function moveButton(button) {

            var buttonWidth = button.offsetWidth;
            var buttonHeight = button.offsetHeight;

            var padding = 20;

            var maxX = window.innerWidth - buttonWidth - padding;
            var maxY = window.innerHeight - buttonHeight - padding;

            var x = padding + Math.random() * (maxX - padding);
            var y = padding + Math.random() * (maxY - padding);

            /*
             * Cambiamos a fixed para poder moverlo
             * por toda la pantalla.
             */
            button.style.position = "fixed";

            button.style.left = x + "px";
            button.style.top = y + "px";

            /*
             * Animación
             */
            button.classList.remove("shake");

            void button.offsetWidth;

            button.classList.add("shake");
        }


        /*
         * Mostrar modal
         */
        function showModal(message) {

            modalMessage.textContent = message;

            modal.style.display = "flex";
        }


        /*
         * Cerrar modal
         */
        closeModal.addEventListener("click", function() {

            modal.style.display = "none";

        });


        /*
         * BOTÓN SÍ
         */
        function tryYes() {

            yesAttempts++;


            /*
             * PRIMER INTENTO
             */
            if (yesAttempts === 1) {

                moveButton(yesButton);

                showModal(
                    "No sóc tan fàcil 😏"
                );

                return;
            }


            /*
             * SEGUNDO INTENTO
             */
            if (yesAttempts === 2) {

                moveButton(yesButton);

                showModal(
                    "Quasi m'has convençut 😏"
                );

                return;
            }


            /*
             * TERCER INTENTO
             */
            if (yesAttempts >= 3) {

                document.getElementById("content").innerHTML = `

                    <div class="success">

                        <h1>
                            Vinga va... accepto
                        </h1>

                       <button id="chooseDay"> 
                            Escull dia
                        </button> 
                    
                    </div> 
                    `; 
                       
                    /* * Botón para ir al calendario. */ 
                    document.getElementById("chooseDay").addEventListener( "click", function() { 
                        window.location.href = "calendari.html"; 
                    } );

            }

        }


        /*
         * PC + móvil
         */
        yesButton.addEventListener("click", function(event) {

            event.preventDefault();

            tryYes();

        });


        /*
         * BOTÓN NO
         *
         * En PC: escapa cuando acercas el ratón.
         */
        noButton.addEventListener("mouseenter", function() {

            moveButton(noButton);

        });


        /*
         * En móvil: escapa cuando lo tocas.
         */
        noButton.addEventListener("touchstart", function(event) {

            event.preventDefault();

            moveButton(noButton);

        });


        /*
         * Evita que el click posterior del móvil
         * llegue a ejecutarse.
         */
        noButton.addEventListener("click", function(event) {

            event.preventDefault();

            moveButton(noButton);

        });


        /*
         * Si gira el móvil o cambia el tamaño,
         * recolocamos los botones.
         */
        window.addEventListener("resize", function() {

            /*
             * Solo recolocamos si ya han empezado a moverse.
             */
            if (yesAttempts > 0) {

                moveButton(yesButton);

            }

        });

    </script>

</body>
</html>
